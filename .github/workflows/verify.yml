name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows-static-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
        working-directory: web-app
      - run: node --test scripts/vinext-windows-static-cache.node.mjs
        working-directory: web-app
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
        working-directory: web-app
      - run: npm test
        working-directory: web-app
      - run: npm run build
        working-directory: web-app
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-ci-only
      - run: python tools/validate_database_schema.py
      - run: python tools/validate_step3.py
      - run: node --test supabase/functions/process-email-outbox/email-content.test.mjs supabase/functions/process-push-outbox/push-content.test.mjs supabase/functions/process-push-outbox/push-delivery.test.mjs

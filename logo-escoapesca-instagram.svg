<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Logo social EscoAPesca</title>
  <desc id="desc">Simbolo EscoAPesca ottimizzato per un avatar circolare.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="74%">
      <stop offset="0" stop-color="#0B2940"/>
      <stop offset=".68" stop-color="#041726"/>
      <stop offset="1" stop-color="#020C15"/>
    </radialGradient>
    <linearGradient id="water" x1="255" y1="360" x2="825" y2="720" gradientUnits="userSpaceOnUse">
